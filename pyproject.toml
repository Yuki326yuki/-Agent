[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-qa-agent"
version = "0.1.0"
description = "Offline-verifiable enterprise knowledge QA agent exercise"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
enterprise-qa = "qa_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
